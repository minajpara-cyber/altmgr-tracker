<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare — Alt-Manager Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ALT-MANAGER <span class="accent">TRACKER</span></div>
  <nav>
    <a href="./index.html">Universe</a>
    <a href="./fund.html">Fund</a>
    <a href="./compare.html" class="active">Compare</a>
    <a href="./filings.html">Filings</a>
  </nav>
  <div class="meta" id="refresh-meta">Loading…</div>
</header>

<main>
  <h1>Cross-fund comparison</h1>
  <div class="compare-layout">
    <aside class="compare-side">
      <h3>Metric</h3>
      <select id="metric">
        <optgroup label="Stock measures">
          <option value="unified_return_pct">Quarterly return % (best available)</option>
          <option value="nav_eop">NAV (end of quarter)</option>
          <option value="nav_change_pct">NAV change %</option>
          <option value="total_return_pct">Total return % (operating)</option>
          <option value="bridge_return_pct">Total return % (NAV bridge — all funds)</option>
          <option value="per_share_return_class_i">Per-share total return % (Class I)</option>
          <option value="per_share_return_class_s">Per-share total return % (Class S)</option>
          <option value="per_share_return_class_d">Per-share total return % (Class D)</option>
        </optgroup>
        <optgroup label="Flow measures">
          <option value="issuance_total">Cash subscriptions</option>
          <option value="drip_total">DRIP</option>
          <option value="total_subscriptions">Total subscriptions (cash + DRIP)</option>
          <option value="repurchases_total">Redemptions (repurchases)</option>
          <option value="distributions_total">Distributions paid</option>
          <option value="net_capital_activity">Net capital activity</option>
        </optgroup>
        <optgroup label="Income statement">
          <option value="management_fees">Management fees</option>
          <option value="total_expenses_gross">Total expenses</option>
          <option value="total_investment_income_or_revenues">Investment income / revenues</option>
        </optgroup>
      </select>

      <div class="unit-toggle" id="unit-toggle">
        <label><input type="radio" name="unit" value="usd" checked> $ Millions</label>
        <label><input type="radio" name="unit" value="pct"> % of BOP NAV</label>
      </div>

      <h3>Chart</h3>
      <div class="unit-toggle" id="chart-toggle">
        <label><input type="radio" name="chart" value="line" checked> Line</label>
        <label><input type="radio" name="chart" value="stacked"> Stacked area</label>
      </div>
      <div class="unit-toggle" id="zoom-toggle">
        <label><input type="radio" name="zoom" value="auto" checked> Auto fit</label>
        <label><input type="radio" name="zoom" value="clip"> Clip outliers</label>
        <label><input type="radio" name="zoom" value="manual"> Manual</label>
      </div>
      <div id="manual-range" style="display:none; font-size:11px; margin-top:4px;">
        <label>Min: <input type="number" id="y-min" style="width:70px;" step="any"></label>
        <label>Max: <input type="number" id="y-max" style="width:70px;" step="any"></label>
      </div>

      <h3>By manager</h3>
      <div class="chip-row" id="manager-chip-row"></div>

      <h3>By strategy / type</h3>
      <div class="chip-row" id="strategy-chip-row"></div>

      <h3>Funds</h3>
      <input type="text" id="ticker-search" placeholder="filter tickers…">
      <div class="ticker-list" id="ticker-list"></div>
    </aside>

    <section>
      <div class="chart-wrap"><canvas id="cmpChart"></canvas></div>
      <h2 class="section-title">Comparison table</h2>
      <div class="qtable-wrap">
        <table class="qtable" id="cmpTable"></table>
      </div>
    </section>
  </div>
</main>

<footer class="sitefoot">
  Data extracted from SEC EDGAR. All dollar values in millions.
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="./app.js"></script>
<script>
(async function() {
  paintRefreshDate();
  let data;
  try { data = await loadData(); } catch { return; }

  const quartersByTicker = groupQuartersByTicker(data.quarters || []);
  const universeByTicker = Object.fromEntries(data.universe.map(u => [u.ticker, u]));
  const tickers = data.universe.filter(u => quartersByTicker.has(u.ticker)).map(u => u.ticker).sort();
  const colorByTicker = {};
  const palette = colorPalette(tickers.length);
  tickers.forEach((t, i) => colorByTicker[t] = palette[i]);

  // Initial selection: top 5 by latest NAV
  const initial = [...tickers].map(t => {
    const arr = quartersByTicker.get(t);
    const latest = arr[arr.length - 1];
    return { t, nav: latest && latest.nav_eop != null ? latest.nav_eop : -1 };
  }).sort((a, b) => b.nav - a.nav).slice(0, 5).map(o => o.t);
  const selected = new Set(initial);

  // Build the master list of quarter_labels across the universe
  const allLabels = [...new Set((data.quarters || []).map(q => q.quarter_label))]
    .sort((a, b) => quarterSortKey(a) - quarterSortKey(b));

  // Ticker list rendering
  const listEl = document.getElementById('ticker-list');
  function renderList(filter = '') {
    const q = filter.toLowerCase().trim();
    listEl.innerHTML = '';
    for (const t of tickers) {
      const u = universeByTicker[t];
      const hay = (t + ' ' + (u.legal_name || '') + ' ' + (u.sponsor || '') + ' ' + (u.strategy || '')).toLowerCase();
      if (q && !hay.includes(q)) continue;
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = t;
      cb.checked = selected.has(t);
      cb.addEventListener('change', () => {
        if (cb.checked) selected.add(t); else selected.delete(t);
        update();
      });
      const swatch = document.createElement('span');
      swatch.style.cssText = `display:inline-block;width:9px;height:9px;background:${colorByTicker[t]};border-radius:1px;`;
      const name = document.createElement('span');
      name.textContent = t;
      const sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = `${u.sponsor}·${u.strategy}`;
      label.append(cb, swatch, name, sub);
      listEl.appendChild(label);
    }
  }
  document.getElementById('ticker-search').addEventListener('input', e => renderList(e.target.value));

  // Build manager + strategy chips dynamically from the universe so every
  // manager / strategy / form factor in the data shows up automatically.
  const allSponsors = [...new Set(tickers.map(t => universeByTicker[t].sponsor).filter(Boolean))].sort();
  const allStrategies = [...new Set(tickers.map(t => universeByTicker[t].strategy).filter(Boolean))].sort();
  const allFormFactors = [...new Set(tickers.map(t => universeByTicker[t].form_factor).filter(Boolean))].sort();

  function selectByFilter(filter) {
    selected.clear();
    for (const t of tickers) if (filter(t)) selected.add(t);
    renderList(document.getElementById('ticker-search').value);
    update();
  }
  function makeChip(rowEl, label, filter, title) {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = label;
    if (title) btn.title = title;
    btn.addEventListener('click', () => selectByFilter(filter));
    rowEl.appendChild(btn);
    return btn;
  }

  // ---- Manager toggles ----
  const managerRow = document.getElementById('manager-chip-row');
  makeChip(managerRow, 'All', () => true, 'Select all funds');
  makeChip(managerRow, 'Clear', () => false, 'Clear selection');
  for (const sponsor of allSponsors) {
    const count = tickers.filter(t => universeByTicker[t].sponsor === sponsor).length;
    makeChip(managerRow, `${sponsor} (${count})`,
      t => universeByTicker[t].sponsor === sponsor,
      `Select all ${sponsor} funds (${count})`);
  }

  // ---- Strategy / type toggles ----
  // Strategies first (Credit, RE, PE, Infra), then form factors (BDC, REIT, IF, etc.)
  const strategyRow = document.getElementById('strategy-chip-row');
  makeChip(strategyRow, 'All', () => true, 'Select all funds');
  makeChip(strategyRow, 'Clear', () => false, 'Clear selection');
  // Friendly labels for compact form-factor codes
  const FORM_LABEL = {
    'nt-BDC': 'NT-BDC',
    'nt-REIT': 'NT-REIT',
    'MA-perp': 'MA-Perpetual',
    'IF': 'Interval Fund',
    'TF': 'Tender Fund',
  };
  for (const strategy of allStrategies) {
    const count = tickers.filter(t => universeByTicker[t].strategy === strategy).length;
    makeChip(strategyRow, `${strategy} (${count})`,
      t => universeByTicker[t].strategy === strategy,
      `Select all ${strategy} funds (${count})`);
  }
  // Add a small divider before form-factor chips
  const sep = document.createElement('span');
  sep.style.cssText = 'display:inline-block;width:1px;height:14px;background:var(--border);margin:0 4px;vertical-align:middle;';
  strategyRow.appendChild(sep);
  for (const ff of allFormFactors) {
    const count = tickers.filter(t => universeByTicker[t].form_factor === ff).length;
    makeChip(strategyRow, `${FORM_LABEL[ff] || ff} (${count})`,
      t => universeByTicker[t].form_factor === ff,
      `Select all ${FORM_LABEL[ff] || ff} funds (${count})`);
  }

  document.getElementById('metric').addEventListener('change', update);
  document.querySelectorAll('input[name="unit"]').forEach(r =>
    r.addEventListener('change', update));
  document.querySelectorAll('input[name="chart"]').forEach(r =>
    r.addEventListener('change', update));

  // Metrics whose values are inherently percentages — toggle is locked to %
  const INHERENT_PCT = new Set(['nav_change_pct', 'total_return_pct',
    'bridge_return_pct', 'unified_return_pct',
    'per_share_return_class_i', 'per_share_return_class_s',
    'per_share_return_class_d', 'per_share_return_class_t',
    'per_share_return_class_e']);
  // Metrics that don't make sense to express as % of NAV
  const STOCK_METRICS = new Set(['nav_eop']);
  // Outflow metrics that should display as negatives even when stored positive
  const NEG_METRICS = new Set(['repurchases_total', 'distributions_total']);

  function computeMetricValue(q, metric, isPctMode) {
    if (q == null) return null;
    if (metric === 'total_return_pct') {
      const nio = q.net_inc_from_ops;
      const bop = q.nav_bop;
      if (nio == null || bop == null || bop === 0) return null;
      return nio / bop;
    }
    let v;
    if (metric === 'total_subscriptions') {
      const a = q.issuance_total, b = q.drip_total;
      v = (a == null && b == null) ? null : (a || 0) + (b || 0);
    } else {
      v = q[metric];
    }
    if (v == null) return null;
    if (NEG_METRICS.has(metric) && v > 0) v = -v;
    if (isPctMode && !INHERENT_PCT.has(metric) && !STOCK_METRICS.has(metric)) {
      const bop = q.nav_bop;
      if (bop == null || bop === 0) return null;
      return v / bop;
    }
    return v;
  }

  function effectiveUnit(metric) {
    if (INHERENT_PCT.has(metric)) return 'pct';
    if (STOCK_METRICS.has(metric)) return 'usd';
    return document.querySelector('input[name="unit"]:checked').value;
  }

  function updateToggleEnabled(metric) {
    const unitWrap = document.getElementById('unit-toggle');
    const unitLocked = INHERENT_PCT.has(metric) || STOCK_METRICS.has(metric);
    unitWrap.querySelectorAll('input').forEach(r => r.disabled = unitLocked);
    unitWrap.classList.toggle('locked', unitLocked);

    // Stacking only makes sense for additive $ flow metrics. Lock stacked
    // when the metric is a stock value, an inherent %, or a % toggle is on.
    const chartWrap = document.getElementById('chart-toggle');
    const inPctMode = document.querySelector('input[name="unit"]:checked').value === 'pct'
      && !unitLocked;
    const stackedLocked = INHERENT_PCT.has(metric) || STOCK_METRICS.has(metric) || inPctMode;
    const stackedRadio = chartWrap.querySelector('input[value="stacked"]');
    const lineRadio = chartWrap.querySelector('input[value="line"]');
    stackedRadio.disabled = stackedLocked;
    if (stackedLocked && stackedRadio.checked) {
      lineRadio.checked = true;
    }
    chartWrap.classList.toggle('locked', stackedLocked);
  }

  // Y-axis scaling — let the user clip outliers or set manual bounds
  document.querySelectorAll('input[name="zoom"]').forEach(r =>
    r.addEventListener('change', () => {
      document.getElementById('manual-range').style.display =
        (document.querySelector('input[name="zoom"]:checked').value === 'manual') ? 'block' : 'none';
      update();
    })
  );
  document.getElementById('y-min').addEventListener('change', update);
  document.getElementById('y-max').addEventListener('change', update);

  function computeYBounds(datasets) {
    const mode = document.querySelector('input[name="zoom"]:checked').value;
    if (mode === 'auto') return {};
    if (mode === 'manual') {
      const mn = parseFloat(document.getElementById('y-min').value);
      const mx = parseFloat(document.getElementById('y-max').value);
      const out = {};
      if (!isNaN(mn)) out.min = mn;
      if (!isNaN(mx)) out.max = mx;
      return out;
    }
    // clip — use 5th/95th percentile of all non-null values across datasets
    const vals = [];
    for (const ds of datasets) {
      for (const pt of (ds.data || [])) {
        const y = pt && typeof pt === 'object' ? pt.y : pt;
        if (y != null && !Number.isNaN(y)) vals.push(y);
      }
    }
    if (vals.length < 4) return {};
    vals.sort((a, b) => a - b);
    const pick = (frac) => vals[Math.max(0, Math.min(vals.length - 1, Math.floor(frac * (vals.length - 1))))];
    let lo = pick(0.05), hi = pick(0.95);
    // Add 10% padding for breathing room
    const pad = (hi - lo) * 0.10 || Math.abs(lo + hi) * 0.05 || 1;
    return { min: lo - pad, max: hi + pad };
  }

  let chart = null;

  function update() {
    const metric = document.getElementById('metric').value;
    updateToggleEnabled(metric);
    const unit = effectiveUnit(metric);
    const isPct = unit === 'pct';

    const chartType = document.querySelector('input[name="chart"]:checked').value;
    const stacked = chartType === 'stacked';

    // For stacked, we want a continuous dense x-axis. Use the master allLabels
    // list so missing quarters become explicit zeros (avoids holes in fill).
    const labels = stacked ? allLabels : null;

    const datasets = [];
    const usedLabels = new Set();
    for (const t of [...selected].sort()) {
      const arr = quartersByTicker.get(t) || [];
      const byLbl = Object.fromEntries(arr.map(q => [q.quarter_label, q]));
      let points;
      if (stacked) {
        // Dense: zero-fill missing quarters so stack accumulates cleanly
        points = allLabels.map(lbl => {
          const q = byLbl[lbl];
          const v = computeMetricValue(q, metric, isPct);
          return { x: lbl, y: v != null ? v : 0 };
        });
      } else {
        // Sparse: leave nulls so line breaks honestly
        points = arr.map(q => {
          const v = computeMetricValue(q, metric, isPct);
          return { x: q.quarter_label, y: v != null ? v : null };
        });
        points.forEach(p => { if (p.y != null) usedLabels.add(p.x); });
      }
      datasets.push({
        label: t,
        data: points,
        borderColor: colorByTicker[t],
        backgroundColor: stacked ? colorByTicker[t] + 'cc' : colorByTicker[t],
        fill: stacked,
        tension: 0.15,
        spanGaps: true,
        pointRadius: stacked ? 0 : 2,
        borderWidth: stacked ? 1.0 : 1.8,
      });
    }
    const finalLabels = stacked
      ? allLabels
      : [...usedLabels].sort((a, b) => quarterSortKey(a) - quarterSortKey(b));

    if (chart) chart.destroy();
    const ctx = document.getElementById('cmpChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        parsing: false,
        interaction: { mode: 'nearest', intersect: false },
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 10 } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed.y;
                return `${ctx.dataset.label}: ${isPct ? fmtPct(v) : fmtM(v)}`;
              },
              title: (items) => items[0] ? items[0].parsed.x : '',
            },
          },
        },
        scales: {
          x: { type: 'category', labels: finalLabels, ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 14 } },
          y: {
            stacked: stacked,
            ticks: { font: { size: 10 }, callback: (v) => isPct ? fmtPct(v) : fmtM(v) },
            ...computeYBounds(datasets),
          },
        },
      },
    });

    // Transposed comparison table — rows = funds, cols = quarter labels
    renderCompareTable(metric, isPct, finalLabels);
  }

  function renderCompareTable(metric, isPct, labels) {
    const table = document.getElementById('cmpTable');
    if (!labels || !labels.length || !selected.size) {
      table.innerHTML = '<tbody><tr><td class="row-label">Select at least one fund to see data.</td></tr></tbody>';
      return;
    }
    let html = '<thead><tr><th class="row-label">Ticker</th>';
    for (const lbl of labels) html += `<th class="qhead">${lbl}</th>`;
    html += '<th class="qhead">Latest</th><th class="qhead">TTM sum / avg</th>';
    html += '</tr></thead><tbody>';
    // Sort funds by latest non-null value descending (so most-active fund on top)
    const tickersOrdered = [...selected].map(t => {
      const arr = quartersByTicker.get(t) || [];
      let latestVal = null;
      for (let i = arr.length - 1; i >= 0; i--) {
        const v = computeMetricValue(arr[i], metric, isPct);
        if (v != null) { latestVal = v; break; }
      }
      return { t, latestVal };
    });
    tickersOrdered.sort((a, b) => {
      if (a.latestVal == null && b.latestVal == null) return a.t.localeCompare(b.t);
      if (a.latestVal == null) return 1;
      if (b.latestVal == null) return -1;
      return Math.abs(b.latestVal) - Math.abs(a.latestVal);
    });
    for (const {t, latestVal} of tickersOrdered) {
      const arr = quartersByTicker.get(t) || [];
      const byLabel = Object.fromEntries(arr.map(q => [q.quarter_label, q]));
      // TTM rollup: sum for flows / dollars, geometric compound for pct
      const allVals = arr.map(q => computeMetricValue(q, metric, isPct)).filter(v => v != null);
      const ttmVals = allVals.slice(-4);
      let ttmAgg = null;
      if (ttmVals.length) {
        if (isPct) {
          // Compound return
          let v = 1;
          for (const r of ttmVals) v *= (1 + r);
          ttmAgg = v - 1;
        } else {
          // Sum dollar values
          ttmAgg = ttmVals.reduce((s, x) => s + x, 0);
        }
      }
      const swatch = colorByTicker[t]
        ? `<span style="display:inline-block;width:8px;height:8px;background:${colorByTicker[t]};border-radius:1px;margin-right:5px;vertical-align:0px;"></span>`
        : '';
      html += `<tr><td class="row-label">${swatch}<a href="./fund.html?ticker=${t}" style="color:inherit;text-decoration:none;font-weight:600">${t}</a></td>`;
      for (const lbl of labels) {
        const q = byLabel[lbl];
        const v = computeMetricValue(q, metric, isPct);
        let text = '—', cls = 'val';
        if (v != null) {
          text = isPct ? fmtPctSigned(v) : fmtM(v);
          cls += ' ' + signClass(v);
        }
        if (q && q.source_form === 'derived-Q4') cls += ' derived';
        html += `<td class="${cls}">${text}</td>`;
      }
      // Latest column
      {
        let text = '—', cls = 'val';
        if (latestVal != null) {
          text = isPct ? fmtPctSigned(latestVal) : fmtM(latestVal);
          cls += ' ' + signClass(latestVal) + ' summary';
        }
        html += `<td class="${cls}">${text}</td>`;
      }
      // TTM column
      {
        let text = '—', cls = 'val';
        if (ttmAgg != null) {
          text = isPct ? fmtPctSigned(ttmAgg) : fmtM(ttmAgg);
          cls += ' ' + signClass(ttmAgg) + ' summary';
        }
        html += `<td class="${cls}">${text}</td>`;
      }
      html += '</tr>';
    }
    html += '</tbody>';
    table.innerHTML = html;
  }

  renderList();
  update();
})();
</script>
</body>
</html>
