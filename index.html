<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alt-Manager Non-Traded Product Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.5.4/dist/css/tabulator.min.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ALT-MANAGER <span class="accent">TRACKER</span></div>
  <nav>
    <a href="./index.html" class="active">Universe</a>
    <a href="./fund.html">Fund</a>
    <a href="./compare.html">Compare</a>
    <a href="./filings.html">Filings</a>
  </nav>
  <div class="meta" id="refresh-meta">Loading…</div>
</header>

<main>
  <h1>Non-traded product universe</h1>
  <div class="stat-row" id="stat-row">
    <div class="stat-card"><div class="label">Total NAV (latest)</div><div class="value" id="stat-nav">…</div><div class="sub" id="stat-nav-sub"></div></div>
    <div class="stat-card"><div class="label">Funds tracked</div><div class="value" id="stat-funds">…</div></div>
    <div class="stat-card"><div class="label">Sponsors</div><div class="value" id="stat-sponsors">…</div></div>
    <div class="stat-card"><div class="label">Latest filing</div><div class="value" id="stat-refresh">…</div></div>
  </div>

  <h2>Funds</h2>
  <div class="table-toolbar">
    <input type="text" id="search" placeholder="filter by ticker, name, sponsor…">
    <select id="strategy-filter"><option value="">All strategies</option></select>
    <select id="sponsor-filter"><option value="">All sponsors</option></select>
  </div>
  <div id="universe-table"></div>
</main>

<footer class="sitefoot">
  Data extracted from SEC EDGAR 10-K / 10-Q / N-CSR filings. All dollar values in millions. Not investment advice.
</footer>

<script src="https://unpkg.com/tabulator-tables@5.5.4/dist/js/tabulator.min.js"></script>
<script src="./app.js"></script>
<script>
(async function() {
  paintRefreshDate();
  let data;
  try { data = await loadData(); } catch { return; }

  const byTicker = groupQuartersByTicker(data.quarters || []);
  const sponsorSet = new Set();
  const strategySet = new Set();

  const rows = [];
  let totalNav = 0;
  let totalNavCount = 0;
  for (const u of data.universe) {
    const qs = byTicker.get(u.ticker) || [];
    const latest = qs.length ? qs[qs.length - 1] : null;
    const navEop = latest ? latest.nav_eop : null;
    if (navEop != null) { totalNav += navEop; totalNavCount++; }
    const iss = latest ? latest.issuance_total : null;
    const rep = latest ? latest.repurchases_total : null;
    let netFlow = null;
    if (iss != null || rep != null) {
      netFlow = (iss || 0) + (rep != null ? -Math.abs(rep) : 0);
    }
    // Pull pre-computed rollups
    const summary = (data.summary_by_ticker || {})[u.ticker] || {};
    // Net flow as % of BOP NAV — comparable across fund sizes
    let netFlowPct = null;
    if (latest && latest.nav_bop && netFlow != null && latest.nav_bop !== 0) {
      netFlowPct = netFlow / latest.nav_bop;
    }
    rows.push({
      ticker: u.ticker,
      legal_name: u.legal_name,
      sponsor: u.sponsor,
      strategy: u.strategy,
      form_factor: u.form_factor,
      latest_period: latest ? latest.quarter_label : null,
      latest_form: latest ? latest.source_form : null,
      nav_eop: navEop,
      growth: latest ? latest.nav_change_pct : null,
      net_flow: netFlow,
      net_flow_pct: netFlowPct,
      latest_return: summary.latest_return ?? null,
      return_src: summary.latest_return_src ?? null,
      ytd_return: summary.ytd_return ?? null,
      ttm_return: summary.ttm_return ?? null,
      y3_return: summary.y3_return ?? null,
      n_periods: qs.length
    });
    if (u.sponsor) sponsorSet.add(u.sponsor);
    if (u.strategy) strategySet.add(u.strategy);
  }

  document.getElementById('stat-nav').textContent = fmtM(totalNav);
  document.getElementById('stat-nav-sub').textContent = `${totalNavCount}/${data.universe.length} funds reporting`;
  document.getElementById('stat-funds').textContent = String(byTicker.size);
  document.getElementById('stat-sponsors').textContent = String(sponsorSet.size);
  document.getElementById('stat-refresh').textContent = fmtDate(data.data_through);

  // Populate filter dropdowns
  const stratSel = document.getElementById('strategy-filter');
  for (const s of [...strategySet].sort()) {
    const o = document.createElement('option'); o.value = s; o.textContent = s; stratSel.appendChild(o);
  }
  const spSel = document.getElementById('sponsor-filter');
  for (const s of [...sponsorSet].sort()) {
    const o = document.createElement('option'); o.value = s; o.textContent = s; spSel.appendChild(o);
  }

  const moneyCell = (cell) => fmtM(cell.getValue());
  const moneySignedCell = (cell) => {
    const v = cell.getValue();
    if (v == null) return '—';
    const el = document.createElement('span');
    el.textContent = fmtMSigned(v);
    if (v > 0) el.className = 'pos'; else if (v < 0) el.className = 'neg';
    return el;
  };
  const pctSignedCell = (cell) => {
    const v = cell.getValue();
    if (v == null) return '—';
    const el = document.createElement('span');
    el.textContent = fmtPctSigned(v);
    if (v > 0) el.className = 'pos'; else if (v < 0) el.className = 'neg';
    return el;
  };

  const table = new Tabulator('#universe-table', {
    data: rows,
    layout: 'fitColumns',
    pagination: false,
    height: '70vh',
    initialSort: [{column: 'latest_return', dir: 'desc'}],
    columns: [
      {title: 'Ticker', field: 'ticker', width: 95, formatter: (cell) => {
         const t = cell.getValue();
         return `<a href="./fund.html?ticker=${encodeURIComponent(t)}"><span class="ticker-badge">${t}</span></a>`;
      }},
      {title: 'Legal Name', field: 'legal_name', minWidth: 200},
      {title: 'Sponsor', field: 'sponsor', width: 80},
      {title: 'Strategy', field: 'strategy', width: 80},
      {title: 'Latest Period', field: 'latest_period', width: 100, cssClass: 'num'},
      {title: 'NAV ($M)', field: 'nav_eop', width: 110, cssClass: 'num', formatter: moneyCell, sorter: 'number'},
      {title: 'Q Return', field: 'latest_return', width: 90, cssClass: 'num', formatter: pctSignedCell, sorter: 'number',
        headerTooltip: 'Latest-quarter total return (NAV change + distribution / BOP NAV).'},
      {title: 'YTD', field: 'ytd_return', width: 80, cssClass: 'num', formatter: pctSignedCell, sorter: 'number',
        headerTooltip: 'Year-to-date return — compounded quarters in the current calendar year'},
      {title: 'TTM', field: 'ttm_return', width: 80, cssClass: 'num', formatter: pctSignedCell, sorter: 'number',
        headerTooltip: 'Trailing 12 months — last 4 quarters compounded'},
      {title: '3-yr', field: 'y3_return', width: 80, cssClass: 'num', formatter: pctSignedCell, sorter: 'number',
        headerTooltip: 'Last 12 quarters compounded (not annualized)'},
      {title: 'NAV chg %', field: 'growth', width: 90, cssClass: 'num', formatter: pctSignedCell, sorter: 'number'},
      {title: 'Net flow $M', field: 'net_flow', width: 110, cssClass: 'num', formatter: moneySignedCell, sorter: 'number',
        headerTooltip: 'Issuance + DRIP − Repurchases (latest period)'},
      {title: 'Flow % NAV', field: 'net_flow_pct', width: 100, cssClass: 'num', formatter: pctSignedCell, sorter: 'number',
        headerTooltip: 'Net capital activity as % of BOP NAV — comparable across fund sizes'},
      {title: '# Q', field: 'n_periods', width: 60, cssClass: 'num'},
    ],
  });

  function applyFilter() {
    const q = (document.getElementById('search').value || '').toLowerCase().trim();
    const strat = stratSel.value;
    const sp = spSel.value;
    table.setFilter((row) => {
      if (strat && row.strategy !== strat) return false;
      if (sp && row.sponsor !== sp) return false;
      if (q && !(
        (row.ticker || '').toLowerCase().includes(q)
        || (row.legal_name || '').toLowerCase().includes(q)
        || (row.sponsor || '').toLowerCase().includes(q)
        || (row.strategy || '').toLowerCase().includes(q)
        || (row.form_factor || '').toLowerCase().includes(q)
      )) return false;
      return true;
    });
  }
  document.getElementById('search').addEventListener('input', applyFilter);
  stratSel.addEventListener('change', applyFilter);
  spSel.addEventListener('change', applyFilter);
})();
</script>
</body>
</html>
