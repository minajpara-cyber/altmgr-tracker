<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fund detail — Alt-Manager Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ALT-MANAGER <span class="accent">TRACKER</span></div>
  <nav>
    <a href="./index.html">Universe</a>
    <a href="./manager.html">Manager</a>
    <a href="./strategy.html">Strategy</a>
    <a href="./monthly.html">Monthly</a>
    <a href="./secondaries.html">GP Stakes</a>
    <a href="./fund.html" class="active">Fund</a>
    <a href="./compare.html">Compare</a>
    <a href="./filings.html">Filings</a>
  </nav>
  <div class="meta" id="refresh-meta">Loading…</div>
</header>

<main>
  <div id="fund-root" class="loading">Loading fund…</div>
</main>

<footer class="sitefoot">
  Data extracted from SEC EDGAR 10-K / 10-Q / N-CSR filings. All dollar values in millions.
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="./app.js"></script>
<script>
(async function() {
  paintRefreshDate();
  const params = new URLSearchParams(location.search);
  const ticker = params.get('ticker');
  const root = document.getElementById('fund-root');

  if (!ticker) {
    root.className = '';
    root.innerHTML = '<div class="error-msg">No ticker specified. Add <code>?ticker=BCRED</code> to the URL or pick a fund from the <a href="./index.html">Universe page</a>.</div>';
    return;
  }

  let data;
  try { data = await loadData(); } catch { return; }
  const universe = data.universe.find(u => u.ticker === ticker);
  const quartersAll = data.quarters || [];
  const quarters = quartersAll
    .filter(q => q.ticker === ticker)
    .sort((a, b) => quarterSortKey(a.quarter_label) - quarterSortKey(b.quarter_label));

  if (!universe) {
    root.className = '';
    root.innerHTML = `<div class="error-msg">Ticker <b>${ticker}</b> not found in universe.</div>`;
    return;
  }
  if (!quarters.length) {
    root.className = '';
    root.innerHTML = `
      <div class="fund-header">
        <div class="name-row"><span class="ticker-badge">${ticker}</span><h1>${universe.legal_name}</h1></div>
      </div>
      <div class="error-msg">No quarterly data extracted yet for ${ticker}.</div>`;
    return;
  }

  const latest = quarters[quarters.length - 1];
  const first = quarters[0];
  const summary = (data.summary_by_ticker || {})[ticker] || {};
  // Most recent quarter that carries an effective management-fee rate.
  const feeQ = [...quarters].reverse().find(q => q.mgmt_fee_rate_annual != null);
  // Year-to-date label: parse year from latest quarter label
  const ytdYear = (latest.quarter_label || '').split(' ').pop() || '';

  root.className = '';
  const cikPadded = (universe.cik_padded || universe.cik || '').padStart(10, '0');
  const edgarUrl = `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${cikPadded}&type=&dateb=&owner=include&count=40`;

  // Period type: are we in Q-mode (BDC/REIT) or H/FY-mode (N-CSR)?
  // If all rows are H or FY, use the H/FY layout; otherwise Q layout.
  const allHFY = quarters.every(q => q.period_type === 'H' || q.period_type === 'FY');

  // Latest net flow (subs - reps) and NAV
  const netFlow = ((latest.issuance_total || 0) + (latest.drip_total || 0))
                 + (latest.repurchases_total != null ? -Math.abs(latest.repurchases_total) : 0);

  root.innerHTML = `
    <div class="fund-header">
      <div class="name-row">
        <span class="ticker-badge">${ticker}</span>
        <h1>${universe.legal_name}</h1>
      </div>
      <div class="pills">
        <span class="pill">${universe.sponsor}</span>
        <span class="pill">${universe.strategy}</span>
        <span class="pill">${universe.form_factor}</span>
        ${universe.status ? `<span class="pill">${universe.status}</span>` : ''}
      </div>
      <div class="links">
        Latest filing: ${fmtDate(latest.filing_date)} (${latest.source_form}) ·
        CIK ${cikPadded} ·
        <a href="${edgarUrl}" target="_blank" rel="noopener">SEC EDGAR &rarr;</a>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="label">Latest NAV</div><div class="value">${fmtM(latest.fund_nav_usd != null ? latest.fund_nav_usd : latest.nav_eop)}${latest.dst_nav_usd ? ` <span style="font-size:12px;color:var(--muted)">(+${fmtM(latest.dst_nav_usd)} DST)</span>` : ''}</div><div class="sub">${latest.quarter_label}${latest.fund_nav_usd != null ? ' · Fund NAV' : ''}</div></div>
      <div class="stat-card"><div class="label">Mgmt fee rate (ann.)</div><div class="value">${feeQ ? (feeQ.mgmt_fee_rate_annual*100).toFixed(2)+'%' : '—'}</div><div class="sub">${feeQ ? feeQ.quarter_label + ' · on ' + fmtM(feeQ.fee_base_usd) + ' base' : 'no fee disclosed'}</div></div>
      <div class="stat-card"><div class="label">Quarter return</div><div class="value ${signClass(summary.latest_return)}">${fmtPctSigned(summary.latest_return)}</div><div class="sub">${summary.latest_return_src || '—'}</div></div>
      <div class="stat-card"><div class="label">YTD return</div><div class="value ${signClass(summary.ytd_return)}">${fmtPctSigned(summary.ytd_return)}</div><div class="sub">${ytdYear} so far</div></div>
      <div class="stat-card"><div class="label">Trailing 12 mo</div><div class="value ${signClass(summary.ttm_return)}">${fmtPctSigned(summary.ttm_return)}</div><div class="sub">last 4 quarters</div></div>
      <div class="stat-card"><div class="label">Trailing 3 yr</div><div class="value ${signClass(summary.y3_return)}">${fmtPctSigned(summary.y3_return)}</div><div class="sub">last 12 qtrs, cumulative</div></div>
      <div class="stat-card"><div class="label">Periods tracked</div><div class="value">${quarters.length}</div><div class="sub">${first.quarter_label} → ${latest.quarter_label}</div></div>
    </div>

    <h2 class="section-title">Performance over time</h2>
    <div class="chart-wrap" style="height:280px;"><canvas id="perfChart"></canvas></div>
    <h2 class="section-title">Quarterly detail</h2>
    <div class="legend">
      <span class="legend-chip"><span class="dot legend-q"></span>Q = 10-Q quarterly</span>
      <span class="legend-chip"><span class="dot legend-derived"></span>derived Q4 = computed from 10-K minus Q1+Q2+Q3</span>
      <span class="legend-chip"><span class="dot legend-h"></span>H/FY = semi-annual or full-year (N-CSR)</span>
    </div>
    <div class="qtable-wrap">
      <table class="qtable" id="qtable"></table>
    </div>
  `;

  // ---- Build transposed table ----
  const table = document.getElementById('qtable');

  // Sections of metrics. Each row: {label, key, kind: 'money'|'pct'|''}
  const SECTIONS = [
    { name: 'Performance', rows: [
      { label: 'Quarter return — unified (%)', key: 'unified_return_pct', kind: 'pctSigned' },
      { label: '  ↳ source', key: 'unified_return_src', kind: 'text' },
      { label: 'NAV bridge return (%)', key: 'bridge_return_pct', kind: 'pctSigned' },
      { label: 'Operating return (%)', key: '_operating_return', kind: 'pctSigned' },
      { label: 'NPORT quarterly return (%)', key: 'quarterly_return', kind: 'pctSigned' },
    ]},
    { name: 'NAV', rows: [
      { label: 'NAV — beginning of period', key: 'nav_bop', kind: 'money' },
      { label: 'NAV — end of period (GAAP equity)', key: 'nav_eop', kind: 'money' },
      { label: 'Fund NAV (manager-published, REITs only)', key: 'fund_nav_usd', kind: 'money' },
      { label: 'DST sleeve NAV (Ares REITs only)', key: 'dst_nav_usd', kind: 'money' },
      { label: 'NAV change ($)', key: 'nav_change', kind: 'moneySigned' },
      { label: 'NAV change (%)', key: 'nav_change_pct', kind: 'pctSigned' },
    ]},
    { name: 'Flows', rows: [
      { label: 'Cash subscriptions (common / REIT)', key: 'issuance_total', kind: 'money' },
      { label: 'DRIP', key: 'drip_total', kind: 'money' },
      { label: 'DST proceeds (new 1031 capital)', key: 'dst_proceeds_usd', kind: 'money' },
      { label: 'Total subscriptions (REIT + DST)', key: '_total_subscriptions', kind: 'money' },
      { label: 'Redemptions', key: 'repurchases_total', kind: 'moneyNeg' },
      { label: 'DST cash payouts', key: 'dst_redemptions_usd', kind: 'moneyNeg' },
      { label: 'OP unit ← DST conversion (intra-platform, not new $)', key: 'op_unit_dst_conversion_usd', kind: 'money' },
      { label: 'Distributions', key: 'distributions_total', kind: 'moneyNeg' },
      { label: 'Net capital activity', key: 'net_capital_activity', kind: 'moneySigned' },
    ]},
    { name: 'Income / P&L', rows: [
      { label: 'Investment income / revenues', key: 'total_investment_income_or_revenues', kind: 'money' },
      { label: 'Net investment income / net income', key: 'net_income_or_nii', kind: 'moneySigned' },
      { label: 'Net change from operations', key: 'net_inc_from_ops', kind: 'moneySigned' },
    ]},
    { name: 'Fees & fee economics', rows: [
      { label: 'Management fees', key: 'management_fees', kind: 'money' },
      { label: 'Fee base — NAV fees are charged on', key: 'fee_base_usd', kind: 'money' },
      { label: 'Effective mgmt-fee rate (annualized)', key: 'mgmt_fee_rate_annual', kind: 'pct2' },
      { label: 'Incentive fees (income-based)', key: 'incentive_fee_income_based', kind: 'money' },
      { label: 'Total expenses (gross)', key: 'total_expenses_gross', kind: 'money' },
    ]},
    { name: 'Balance sheet (point-in-time)', rows: [
      { label: 'Total assets', key: 'total_assets', kind: 'money' },
      { label: 'Total liabilities', key: 'total_liabilities', kind: 'money' },
      { label: 'Total debt', key: 'total_debt', kind: 'money' },
      { label: 'Total net assets / equity', key: 'total_net_assets_or_equity', kind: 'money' },
    ]},
  ];

  // ---- Per-share section (only for funds that have any per-share data) ----
  // Multi-class share classes: I, S, D, T, E (in priority order — I usually
  // dominates). We show NAV/share + shares outstanding by class, plus a
  // quarterly per-share return % computed from class I (the dominant class
  // for every multi-class fund in the universe).
  const SHARE_CLASSES = ['i', 's', 'd', 't', 'e'];
  const hasPerShare = quarters.some(q =>
    SHARE_CLASSES.some(c =>
      q['nav_per_share_class_' + c] != null ||
      q['shares_outstanding_class_' + c] != null
    )
  );

  let PER_SHARE_SECTION = null;
  if (hasPerShare) {
    // Only show classes that actually have data in at least one quarter.
    const classesWithData = SHARE_CLASSES.filter(c =>
      quarters.some(q =>
        q['nav_per_share_class_' + c] != null ||
        q['shares_outstanding_class_' + c] != null
      )
    );
    const psRows = [];
    // NAV / share by class
    for (const c of classesWithData) {
      psRows.push({
        label: `NAV / share — Class ${c.toUpperCase()}`,
        key: 'nav_per_share_class_' + c,
        kind: 'usd',
      });
    }
    // Shares outstanding by class
    for (const c of classesWithData) {
      psRows.push({
        label: `Shares outstanding — Class ${c.toUpperCase()}`,
        key: 'shares_outstanding_class_' + c,
        kind: 'int',
      });
    }
    // Distribution per share (fund-level approximation: |distributions_total| / total shares outstanding)
    psRows.push({
      label: `Distribution / share`,
      key: 'dist_per_share',
      kind: 'usd',
    });
    // Fund-REPORTED per-class total return (Financial Highlights, YTD chains
    // de-telescoped to quarterly in 09_quarterize.py) — the fund's own
    // '40-Act total-return figure; shown first when available.
    const reportedClasses = SHARE_CLASSES.filter(c =>
      quarters.some(q => q['fh_reported_return_class_' + c] != null));
    for (const c of reportedClasses) {
      psRows.push({
        label: `Reported total return (%) — Class ${c.toUpperCase()}`,
        key: 'fh_reported_return_class_' + c,
        kind: 'pctSigned',
      });
    }
    // Per-share quarterly TOTAL return derived by us (NAV change +
    // distribution per share), precomputed in 09_quarterize.py per class.
    for (const c of classesWithData) {
      psRows.push({
        label: `Total return, derived (%) — Class ${c.toUpperCase()}`,
        key: 'per_share_return_class_' + c,
        kind: 'pctSigned',
      });
    }
    PER_SHARE_SECTION = { name: 'Per share', rows: psRows };
  }

  // Header row: empty corner + quarter labels
  let html = '<thead><tr><th class="row-label">Metric \\ Period</th>';
  for (const q of quarters) {
    const cls = q.source_form === 'derived-Q4' ? 'qhead derived'
              : q.period_type === 'H' ? 'qhead semi'
              : q.period_type === 'FY' ? 'qhead annual'
              : 'qhead';
    html += `<th class="${cls}"><div>${q.quarter_label}</div><div class="qhead-sub">${q.source_form}</div></th>`;
  }
  html += '</tr></thead><tbody>';

  const allSections = PER_SHARE_SECTION ? SECTIONS.concat([PER_SHARE_SECTION]) : SECTIONS;
  for (const section of allSections) {
    html += `<tr class="section-row"><td colspan="${quarters.length + 1}">${section.name}</td></tr>`;
    for (const row of section.rows) {
      html += `<tr><td class="row-label">${row.label}</td>`;
      for (let qi = 0; qi < quarters.length; qi++) {
        const q = quarters[qi];
        let v;
        if (row.key === '_total_subscriptions') {
          // All new investor money in: common stock + DRIP + DST proceeds.
          // DST proceeds are gross 1031-exchange capital sold this quarter
          // (Ares REITs only). Excludes OP-unit ← DST conversions, which
          // are intra-platform reclassifications, not new money.
          const a = q.issuance_total, b = q.drip_total, c = q.dst_proceeds_usd;
          const parts = [a, b, c].filter(x => x != null);
          v = parts.length ? parts.reduce((s, x) => s + x, 0) : null;
        } else if (row.key === '_operating_return') {
          // Derived: net_inc_from_ops / nav_bop
          const nio = q.net_inc_from_ops, bop = q.nav_bop;
          v = (nio != null && bop != null && bop !== 0) ? nio / bop : null;
        } else {
          v = q[row.key];
        }
        let text = '—';
        let cls = 'val';
        if (row.kind === 'text') {
          // Plain string — used for source/provenance labels
          if (v) { text = String(v); cls += ' dim'; }
        } else if (v != null && !Number.isNaN(v)) {
          if (row.kind === 'money') {
            // Show as positive magnitude; if stored as negative, display in parens.
            text = fmtM(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'moneySigned') {
            text = fmtMSigned(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'moneyNeg') {
            // Distributions / repurchases — typically stored negative.
            // Always display as a negative magnitude in red, parenthesized.
            const mag = -Math.abs(v);
            text = fmtM(mag);
            cls += ' neg';
          } else if (row.kind === 'pctSigned') {
            text = fmtPctSigned(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'pct') {
            text = fmtPct(v);
          } else if (row.kind === 'pct2') {
            // Fee rates need 2 decimals (1.07% vs 1.25% matters).
            text = (v * 100).toFixed(2) + '%';
          } else if (row.kind === 'usd') {
            // Per-share NAV in dollars (e.g. $24.19), not millions.
            text = fmtUsd(v);
          } else if (row.kind === 'int') {
            text = fmtInt(v);
          }
        }
        if (q.source_form === 'derived-Q4') cls += ' derived';
        // Interpolated fee/expense cells: when quarterize splits H1/FY
        // cumulative values across quarters (NAV-weighted), flag the cell
        // with an "interp" superscript and tinted background so users see
        // these are estimates, not directly reported.
        const interpFields = (q.interpolated_fields || '').split(',').filter(Boolean);
        let tooltip = '';
        if (interpFields.includes(row.key) && v != null) {
          cls += ' interpolated';
          const src = q.fee_interp_source || '';
          const method = q.fee_interp_method || 'NAV-weighted';
          // Incentive fees use return-weighting (performance-driven);
          // others use NAV-weighting.
          const weightNote = (row.key === 'incentive_fee_income_based'
                              ? 'return-weighted (max(0, quarterly return))'
                              : 'NAV-weighted (avg of BOP/EOP)');
          text = `${text} <sup style="font-size:9px;color:var(--accent);font-weight:600;letter-spacing:0.02em">interp</sup>`;
          tooltip = ` title="Interpolated single-quarter value — ${weightNote} split of ${src}. Quarter values sum to the reported H1 / FY cumulative."`;
        }
        html += `<td class="${cls}"${tooltip}>${text}</td>`;
      }
      html += '</tr>';
    }
  }
  html += '</tbody>';
  table.innerHTML = html;

  // Performance-over-time chart — quarterly return % bars + cumulative line
  const labels = quarters.map(q => q.quarter_label);
  const qReturns = quarters.map(q => q.unified_return_pct != null ? q.unified_return_pct * 100 : null);
  // Cumulative (compounded) return from first quarter
  let cum = 1;
  const cumReturns = quarters.map(q => {
    if (q.unified_return_pct == null) return null;
    cum *= (1 + q.unified_return_pct);
    return (cum - 1) * 100;
  });
  const ctx = document.getElementById('perfChart').getContext('2d');
  new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { type: 'bar', label: 'Quarterly return %',
          data: qReturns, yAxisID: 'y1',
          backgroundColor: qReturns.map(v => v == null ? '#ccc' : (v >= 0 ? 'rgba(46,160,67,0.7)' : 'rgba(207,34,46,0.7)')),
          borderColor: 'rgba(0,0,0,0)' },
        { type: 'line', label: 'Cumulative return %',
          data: cumReturns, yAxisID: 'y2',
          borderColor: '#1f5fa6', backgroundColor: '#1f5fa6',
          borderWidth: 1.8, pointRadius: 0, tension: 0.15, spanGaps: true },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { font: {size:11}, boxWidth: 10 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y != null ? c.parsed.y.toFixed(2)+'%' : '—'}` } },
      },
      scales: {
        x: { ticks: { font: {size: 10}, maxRotation: 0, autoSkip: true, maxTicksLimit: 14 } },
        y1: { position: 'left', ticks: { font: {size: 10}, callback: v => v.toFixed(1)+'%' },
              title: { display: true, text: 'Quarterly %', font: {size: 10} } },
        y2: { position: 'right', grid: { drawOnChartArea: false }, ticks: { font: {size: 10}, callback: v => v.toFixed(0)+'%' },
              title: { display: true, text: 'Cumulative %', font: {size: 10} } },
      },
    },
  });
})();
</script>
</body>
</html>
