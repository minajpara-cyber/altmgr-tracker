<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fund detail — Alt-Manager Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.5.4/dist/css/tabulator.min.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ALT-MANAGER <span class="accent">TRACKER</span></div>
  <nav>
    <a href="./index.html">Universe</a>
    <a href="./fund.html" class="active">Fund</a>
    <a href="./compare.html">Compare</a>
  </nav>
  <div class="meta" id="refresh-meta">Loading…</div>
</header>

<main>
  <div id="fund-root" class="loading">Loading fund…</div>
</main>

<footer class="sitefoot">
  Data extracted from SEC EDGAR. Values in actual dollars.
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/tabulator-tables@5.5.4/dist/js/tabulator.min.js"></script>
<script src="./app.js"></script>
<script>
(async function() {
  paintRefreshDate();
  const params = new URLSearchParams(location.search);
  const ticker = params.get('ticker');
  const root = document.getElementById('fund-root');

  if (!ticker) {
    root.className = '';
    root.innerHTML = '<div class="error-msg">No ticker specified. Add <code>?ticker=BCRED</code> to the URL or pick a fund from the <a href="./index.html">Universe page</a>.</div>';
    return;
  }

  let data;
  try { data = await loadData(); } catch { return; }
  const universe = data.universe.find(u => u.ticker === ticker);
  const filings = data.filings.filter(f => f.ticker === ticker).sort((a,b) => (a.filing_date || '').localeCompare(b.filing_date || ''));

  if (!universe) {
    root.className = '';
    root.innerHTML = `<div class="error-msg">Ticker <b>${ticker}</b> not found in universe.</div>`;
    return;
  }
  if (!filings.length) {
    root.className = '';
    root.innerHTML = `<div class="fund-header"><div class="name-row"><span class="ticker-badge">${ticker}</span><h1>${universe.legal_name}</h1></div></div><div class="error-msg">No filings extracted yet for ${ticker}.</div>`;
    return;
  }

  const first = filings[0];
  const latest = filings[filings.length - 1];
  const cumChange = (latest.nav_eop != null && first.nav_bop != null && first.nav_bop !== 0)
    ? (latest.nav_eop - first.nav_bop) / first.nav_bop
    : null;

  root.className = '';
  const cikPadded = (universe.cik_padded || universe.cik || '').padStart(10, '0');
  const edgarUrl = `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${cikPadded}&type=&dateb=&owner=include&count=40`;
  root.innerHTML = `
    <div class="fund-header">
      <div class="name-row">
        <span class="ticker-badge">${ticker}</span>
        <h1>${universe.legal_name}</h1>
      </div>
      <div class="pills">
        <span class="pill">${universe.sponsor}</span>
        <span class="pill">${universe.strategy}</span>
        <span class="pill">${universe.form_factor}</span>
        <span class="pill">${universe.status || ''}</span>
      </div>
      <div class="links">
        CIK ${cikPadded} · <a href="${edgarUrl}" target="_blank" rel="noopener">SEC EDGAR filings &rarr;</a>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="label">Current NAV</div><div class="value">${fmtMoney(latest.nav_eop)}</div><div class="sub">${fmtDate(latest.filing_date)} (${latest.form})</div></div>
      <div class="stat-card"><div class="label">Period growth</div><div class="value ${latest.nav_eop_period_growth >= 0 ? 'pos' : 'neg'}">${fmtPctSigned(latest.nav_eop_period_growth)}</div><div class="sub">latest filing</div></div>
      <div class="stat-card"><div class="label">Cumulative NAV change</div><div class="value ${cumChange >= 0 ? 'pos' : 'neg'}">${fmtPctSigned(cumChange)}</div><div class="sub">since ${fmtDate(first.filing_date)}</div></div>
      <div class="stat-card"><div class="label">Filings tracked</div><div class="value">${filings.length}</div><div class="sub">${fmtDate(first.filing_date)} → ${fmtDate(latest.filing_date)}</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="nav">NAV time series</button>
      <button class="tab-btn" data-tab="flows">Flow breakdown</button>
      <button class="tab-btn" data-tab="table">Full data table</button>
    </div>

    <div class="tab-panel active" id="tab-nav">
      <div class="chart-wrap"><canvas id="navChart"></canvas></div>
    </div>
    <div class="tab-panel" id="tab-flows">
      <div class="chart-wrap"><canvas id="flowChart"></canvas></div>
    </div>
    <div class="tab-panel" id="tab-table">
      <div class="table-toolbar">
        <button class="btn" id="dl-csv">Download CSV</button>
      </div>
      <div id="full-table"></div>
    </div>
  `;

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // NAV chart
  const labels = filings.map(f => f.filing_date);
  const navCtx = document.getElementById('navChart').getContext('2d');
  new Chart(navCtx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'NAV (end of period)',
          data: filings.map(f => f.nav_eop),
          borderColor: '#c47a00',
          backgroundColor: 'rgba(196, 122, 0, 0.1)',
          tension: 0.15,
          spanGaps: true,
          pointRadius: 3,
        },
        {
          label: 'NAV (beginning of period)',
          data: filings.map(f => f.nav_bop),
          borderColor: '#1f5fa6',
          backgroundColor: 'rgba(31, 95, 166, 0.1)',
          tension: 0.15,
          spanGaps: true,
          pointRadius: 3,
          borderDash: [4, 4],
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.dataset.label}: ${fmtMoney(ctx.parsed.y)}`,
          },
        },
      },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true } },
        y: { ticks: { font: { size: 10 }, callback: (v) => fmtMoney(v) } },
      },
    },
  });

  // Flow chart (stacked bar)
  const flowCtx = document.getElementById('flowChart').getContext('2d');
  new Chart(flowCtx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Issuance', data: filings.map(f => f.issuance_total), backgroundColor: '#1f5fa6', stack: 's' },
        { label: 'DRIP', data: filings.map(f => f.drip_total), backgroundColor: '#52be80', stack: 's' },
        { label: 'Distributions', data: filings.map(f => f.distributions_total != null ? -Math.abs(f.distributions_total) : null), backgroundColor: '#c0392b', stack: 's' },
        { label: 'Repurchases', data: filings.map(f => f.repurchases_total != null ? -Math.abs(f.repurchases_total) : null), backgroundColor: '#d35400', stack: 's' },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmtMoney(ctx.parsed.y)}` } },
      },
      scales: {
        x: { stacked: true, ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true } },
        y: { stacked: true, ticks: { font: { size: 10 }, callback: (v) => fmtMoney(v) } },
      },
    },
  });

  // Full table — show every column
  const allCols = Object.keys(filings[0]);
  const dropCols = new Set(['ticker', 'sponsor', 'strategy', 'form_factor', 'legal_name', 'cik']);
  const cols = [
    {title: 'Filing Date', field: 'filing_date', frozen: true, width: 120, cssClass: 'num'},
    {title: 'Form', field: 'form', width: 70, frozen: true},
    {title: 'Period Months', field: 'period_months', width: 80, cssClass: 'num'},
  ];
  const seen = new Set(cols.map(c => c.field));
  for (const c of allCols) {
    if (dropCols.has(c) || seen.has(c)) continue;
    seen.add(c);
    const isNumeric = filings.some(f => typeof f[c] === 'number');
    const col = { title: c, field: c, width: 130 };
    if (isNumeric) {
      col.cssClass = 'num';
      col.formatter = (cell) => {
        const v = cell.getValue();
        if (v == null) return '—';
        if (c.includes('growth') || c.includes('pct')) return fmtPct(v);
        return fmtMoney(v);
      };
      col.sorter = 'number';
    }
    cols.push(col);
  }

  const table = new Tabulator('#full-table', {
    data: filings,
    layout: 'fitDataStretch',
    height: '60vh',
    columns: cols,
    initialSort: [{column: 'filing_date', dir: 'asc'}],
  });
  document.getElementById('dl-csv').addEventListener('click', () => {
    table.download('csv', `${ticker}_filings.csv`);
  });
})();
</script>
</body>
</html>
