<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fund detail — Alt-Manager Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=20260727-1">
</head>
<body>
<header class="topbar">
  <div class="brand">ALT-MANAGER <span class="accent">TRACKER</span></div>
  <nav>
    <a href="./index.html">Universe</a>
    <a href="./manager.html">Manager</a>
    <a href="./strategy.html">Strategy</a>
    <a href="./monthly.html">Monthly</a>
    <a href="./secondaries.html">GP Stakes</a>
    <a href="./fundrecords.html">Fund Records</a>
    <a href="./compare.html">Compare</a>
    <a href="./filings.html">Filings</a>
  </nav>
  <div class="meta" id="refresh-meta">Loading…</div>
</header>

<main>
  <div id="fund-root" class="loading">Loading fund…</div>
</main>

<footer class="sitefoot">
  Data extracted from SEC EDGAR 10-K / 10-Q / N-CSR filings. All dollar values in millions.
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="./app.js?v=20260714-1"></script>
<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const ticker = params.get('ticker');
  const root = document.getElementById('fund-root');

  let data;
  try { data = await loadData(); } catch { return; }
  paintRefreshDate(data);

  if (!ticker) {
    root.className = '';
    const options = [...data.universe].sort((a,b) => a.ticker.localeCompare(b.ticker))
      .map(u => `<option value="${u.ticker}">${u.ticker} — ${u.legal_name} (${u.sponsor} · ${u.strategy})</option>`).join('');
    root.innerHTML = `<div class="fund-header"><h1>Find a fund</h1><p class="muted">Choose any tracked vehicle to open its performance, flows, fees, and filing history.</p></div>
      <form id="fund-picker" class="method-card" style="max-width:720px">
        <label class="field"><span>Fund</span><select id="fund-select">${options}</select></label>
        <button class="btn primary" type="submit" style="margin-top:10px">Open fund</button>
      </form>`;
    document.getElementById('fund-picker').addEventListener('submit', e => {
      e.preventDefault();
      location.href = `./fund.html?ticker=${encodeURIComponent(document.getElementById('fund-select').value)}`;
    });
    return;
  }
  const universe = data.universe.find(u => u.ticker === ticker);
  const quartersAll = (data.quarters || [])
    .filter(q => q.ticker === ticker)
    .sort((a, b) => quarterSortKey(a.quarter_label) - quarterSortKey(b.quarter_label));
  const periodView = params.get('periods') === 'all' ? 'all' : 'recent';
  const quarters = periodView === 'all' ? quartersAll : quartersAll.slice(-12);

  if (!universe) {
    root.className = '';
    root.innerHTML = `<div class="error-msg">Ticker <b>${ticker}</b> not found in universe.</div>`;
    return;
  }
  if (!quarters.length) {
    root.className = '';
    root.innerHTML = `
      <div class="fund-header">
        <div class="name-row"><span class="ticker-badge">${ticker}</span><h1>${universe.legal_name}</h1></div>
      </div>
      <div class="error-msg">No quarterly data extracted yet for ${ticker}.</div>`;
    return;
  }

  const latest = quartersAll[quartersAll.length - 1];
  const first = quartersAll[0];
  const summary = (data.summary_by_ticker || {})[ticker] || {};
  // Most recent quarter that carries an effective management-fee rate.
  const feeQ = [...quartersAll].reverse().find(q => q.mgmt_fee_rate_annual != null);
  // Year-to-date label: parse year from latest quarter label
  const ytdYear = (latest.quarter_label || '').split(' ').pop() || '';

  root.className = '';
  const cikPadded = (universe.cik_padded || universe.cik || '').padStart(10, '0');
  const edgarUrl = `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${cikPadded}&type=&dateb=&owner=include&count=40`;

  // Period type: are we in Q-mode (BDC/REIT) or H/FY-mode (N-CSR)?
  // If all rows are H or FY, use the H/FY layout; otherwise Q layout.
  const allHFY = quartersAll.every(q => q.period_type === 'H' || q.period_type === 'FY');

  const RETURN_SOURCE_LABELS = {
    fh_reported_return_class_i: 'Fund-reported Class I total return',
    per_share_return_class_i: 'Derived Class I total return',
    bridge_return_pct: 'NAV bridge return',
    quarterly_return: 'N-PORT quarterly return',
  };

  // Latest net flow (subs - reps) and NAV
  const netFlow = ((latest.issuance_total || 0) + (latest.drip_total || 0))
                 + (latest.repurchases_total != null ? -Math.abs(latest.repurchases_total) : 0);

  // H/FY-cadence funds (international AR/SAR filers) report halves and
  // years, not quarters — trailing-window subtitles must say so. The
  // windows themselves are already sized in months by the site builder.
  const isHF = quartersAll.some(q => /^(H\d|FY)\b/.test(q.quarter_label || ''));
  const fxNote = (() => {
    const notes = (data.fx_notes || {})[ticker];
    if (!notes) return '';
    const labels = Object.keys(notes);
    const lbl = notes[latest.quarter_label] ? latest.quarter_label
              : labels.sort((a, b) => quarterSortKey(a) - quarterSortKey(b)).pop();
    return notes[lbl] ? `${lbl}: ${notes[lbl]}` : '';
  })();

  // Portfolio composition (PG factsheet strategy mix) — latest month
  const MIX_TITLES = {
    asset_class: 'By asset class', financing_stage: 'By financing stage',
    region: 'By region', transaction_type: 'By transaction type',
    industry_sector: 'By industry sector',
  };
  const MIX_ORDER = ['asset_class', 'financing_stage', 'region',
                     'transaction_type', 'industry_sector'];
  const mix = (data.asset_mix || {})[ticker];
  const mixHtml = mix ? `
    <h2 class="section-title">Portfolio composition</h2>
    <div style="font-size:12px;color:var(--muted);margin:-8px 0 10px;">
      Manager factsheet, as of ${fmtDate(mix.as_of)}${mix.months > 1 ? ` · ${mix.months} months collected` : ''}</div>
    <div class="stat-row">
      ${MIX_ORDER.filter(c => mix.categories[c]).map(c => `
        <div class="stat-card" style="min-width:210px;">
          <div class="label">${MIX_TITLES[c] || c}</div>
          <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;">
            ${mix.categories[c].map(([lb, p]) => `
              <tr><td style="padding:2px 0;color:var(--muted);">${lb}</td>
                  <td style="padding:2px 0;text-align:right;font-variant-numeric:tabular-nums;">${p % 1 ? p.toFixed(1) : p}%</td></tr>`).join('')}
          </table>
        </div>`).join('')}
    </div>` : '';

  root.innerHTML = `
    <div class="fund-header">
      <div class="name-row">
        <span class="ticker-badge">${ticker}</span>
        <h1>${universe.legal_name}</h1>
      </div>
      <div class="pills">
        <span class="pill">${universe.sponsor}</span>
        <span class="pill">${universe.strategy}</span>
        <span class="pill">${universe.form_factor}</span>
        ${universe.status ? `<span class="pill">${universe.status}</span>` : ''}
      </div>
      <div class="links">
        Latest ${(universe.cik || '').trim() ? 'filing' : 'report'}: ${fmtDate(latest.filing_date)} (${latest.source_form}) ·
        ${(universe.cik || '').trim()
          ? `CIK ${cikPadded} · <a href="${edgarUrl}" target="_blank" rel="noopener">SEC EDGAR &rarr;</a>`
          : (() => {
              const SRC = { PGHN: ['partnersgroup.com', 'https://www.partnersgroup.com'],
                            BX: { ECRED_LX: ['ecred.com', 'https://www.ecred.com/resources/'],
                                  BEPIF: ['bepif.com', 'https://www.bepif.com/shareholders/'],
                                  BXPE_LX: ['bxpef.com', 'https://www.bxpef.com/information/'] } };
              const FUNDSQUARE = { HL_GPA: 1, HL_GPI: 1, HL_GVC: 1, HL_GPS: 1,
                                   K_PRIME: 1, KIF: 1, AESIF: 1, CAPM_LX: 1,
                                   CAPM_SEC: 1, BII: 1 };
              let src = SRC[universe.sponsor];
              if (src && !Array.isArray(src)) src = src[ticker];
              if (!src && FUNDSQUARE[ticker])
                src = ['Fundsquare (LuxSE)', 'https://www.fundsquare.net/documents-library'];
              return src
                ? `non-SEC — public reports via <a href="${src[1]}" target="_blank" rel="noopener">${src[0]} &rarr;</a>`
                : 'non-SEC — public fund reports';
            })()}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="label">Latest NAV</div><div class="value">${fmtM(latest.fund_nav_usd != null ? latest.fund_nav_usd : latest.nav_eop)}${latest.dst_nav_usd ? ` <span style="font-size:12px;color:var(--muted)">(+${fmtM(latest.dst_nav_usd)} DST)</span>` : ''}</div><div class="sub">${latest.quarter_label}${latest.fund_nav_usd != null ? ' · Fund NAV' : ''}</div></div>
      <div class="stat-card"><div class="label">Mgmt fee rate (ann.)</div><div class="value">${feeQ ? (feeQ.mgmt_fee_rate_annual*100).toFixed(2)+'%' : '—'}</div><div class="sub">${feeQ ? feeQ.quarter_label + ' · on ' + fmtM(feeQ.fee_base_usd) + ' base' : 'no fee disclosed'}</div></div>
      <div class="stat-card"><div class="label">${isHF ? 'Period return' : 'Quarter return'}</div><div class="value ${signClass(summary.latest_return)}">${fmtPctSigned(summary.latest_return)}</div><div class="sub">${RETURN_SOURCE_LABELS[summary.latest_return_src] || summary.latest_return_src || '—'}</div></div>
      <div class="stat-card"><div class="label">YTD return</div><div class="value ${signClass(summary.ytd_return)}">${fmtPctSigned(summary.ytd_return)}</div><div class="sub">${ytdYear} so far</div></div>
      <div class="stat-card"><div class="label">Trailing 12 mo</div><div class="value ${signClass(summary.ttm_return)}">${fmtPctSigned(summary.ttm_return)}</div><div class="sub">${isHF ? '12-month window' : 'last 4 quarters'}</div></div>
      <div class="stat-card"><div class="label">Trailing 3 yr</div><div class="value ${signClass(summary.y3_return)}">${fmtPctSigned(summary.y3_return)}</div><div class="sub">${isHF ? '36-month window, cumulative' : 'last 12 qtrs, cumulative'}</div></div>
      <div class="stat-card"><div class="label">Periods tracked</div><div class="value">${quartersAll.length}</div><div class="sub">${first.quarter_label} → ${latest.quarter_label}</div></div>
    </div>
    ${fxNote ? `<div style="margin:-6px 0 14px;font-size:12px;color:var(--muted);">FX: reported in EUR, shown in USD — ${fxNote}</div>` : ''}
    ${mixHtml}

    <h2 class="section-title">Performance over time</h2>
    <div class="chart-wrap" style="height:280px;"><canvas id="perfChart"></canvas></div>
    <h2 class="section-title">Quarterly detail</h2>
    <div class="table-toolbar">
      <span class="control-label">History</span>
      <button class="btn ${periodView === 'recent' ? 'primary' : ''}" id="period-recent" type="button">Recent 12</button>
      <button class="btn ${periodView === 'all' ? 'primary' : ''}" id="period-all" type="button">All periods</button>
      <span class="control-label">Section</span>
      <button class="chip active" type="button" data-section-filter="all">All</button>
      <button class="chip" type="button" data-section-filter="performance">Performance</button>
      <button class="chip" type="button" data-section-filter="nav">NAV</button>
      <button class="chip" type="button" data-section-filter="flows">Flows</button>
      <button class="chip" type="button" data-section-filter="fees-fee-economics">Fees</button>
    </div>
    <div class="legend">
      <span class="legend-chip"><span class="dot legend-q"></span>Q = 10-Q quarterly</span>
      <span class="legend-chip"><span class="dot legend-derived"></span>derived Q4 = computed from 10-K minus Q1+Q2+Q3</span>
      <span class="legend-chip"><span class="dot legend-h"></span>H/FY = semi-annual or full-year (N-CSR)</span>
    </div>
    <div class="qtable-wrap">
      <table class="qtable" id="qtable"></table>
    </div>
    <div id="monthly-history"></div>
  `;

  // ---- Build transposed table ----
  const table = document.getElementById('qtable');

  // Sections of metrics. Each row: {label, key, kind: 'money'|'pct'|''}
  const SECTIONS = [
    { name: 'Performance', rows: [
      { label: 'Quarter return — unified (%)', key: 'unified_return_pct', kind: 'pctSigned' },
      { label: '  ↳ source', key: 'unified_return_src', kind: 'text' },
      { label: 'NAV bridge return (%)', key: 'bridge_return_pct', kind: 'pctSigned' },
      { label: 'Operating return (%)', key: '_operating_return', kind: 'pctSigned' },
      { label: 'NPORT quarterly return (%)', key: 'quarterly_return', kind: 'pctSigned' },
    ]},
    { name: 'NAV', rows: [
      { label: 'NAV — beginning of period', key: 'nav_bop', kind: 'money' },
      { label: 'NAV — end of period (GAAP equity)', key: 'nav_eop', kind: 'money' },
      { label: 'Fund NAV (manager-published, REITs only)', key: 'fund_nav_usd', kind: 'money' },
      { label: 'DST sleeve NAV (Ares REITs only)', key: 'dst_nav_usd', kind: 'money' },
      { label: 'NAV change ($)', key: 'nav_change', kind: 'moneySigned' },
      { label: 'NAV change (%)', key: 'nav_change_pct', kind: 'pctSigned' },
    ]},
    { name: 'Flows', rows: [
      { label: 'Cash subscriptions (common / REIT)', key: 'issuance_total', kind: 'money' },
      { label: 'DRIP', key: 'drip_total', kind: 'money' },
      { label: 'DST proceeds (new 1031 capital)', key: 'dst_proceeds_usd', kind: 'money' },
      { label: 'Total subscriptions (REIT + DST)', key: '_total_subscriptions', kind: 'money' },
      { label: 'Redemptions', key: 'repurchases_total', kind: 'moneyNeg' },
      { label: 'DST cash payouts', key: 'dst_redemptions_usd', kind: 'moneyNeg' },
      { label: 'OP unit ← DST conversion (intra-platform, not new $)', key: 'op_unit_dst_conversion_usd', kind: 'money' },
      { label: 'Distributions', key: 'distributions_total', kind: 'moneyNeg' },
      { label: 'Net capital activity', key: 'net_capital_activity', kind: 'moneySigned' },
    ]},
    { name: 'Income / P&L', rows: [
      { label: 'Investment income / revenues', key: 'total_investment_income_or_revenues', kind: 'money' },
      { label: 'Net investment income / net income', key: 'net_income_or_nii', kind: 'moneySigned' },
      { label: 'Net change from operations', key: 'net_inc_from_ops', kind: 'moneySigned' },
    ]},
    { name: 'Fees & fee economics', rows: [
      { label: 'Management fees', key: 'management_fees', kind: 'money' },
      { label: 'Fee base — NAV fees are charged on', key: 'fee_base_usd', kind: 'money' },
      { label: 'Effective mgmt-fee rate (annualized)', key: 'mgmt_fee_rate_annual', kind: 'pct2' },
      { label: 'Incentive fees (income-based)', key: 'incentive_fee_income_based', kind: 'money' },
      { label: 'Total expenses (gross)', key: 'total_expenses_gross', kind: 'money' },
    ]},
    { name: 'Balance sheet (point-in-time)', rows: [
      { label: 'Total assets', key: 'total_assets', kind: 'money' },
      { label: 'Total liabilities', key: 'total_liabilities', kind: 'money' },
      { label: 'Total debt', key: 'total_debt', kind: 'money' },
      { label: 'Total net assets / equity', key: 'total_net_assets_or_equity', kind: 'money' },
    ]},
  ];

  // ---- Per-share section (only for funds that have any per-share data) ----
  // Multi-class share classes: I, S, D, T, E (in priority order — I usually
  // dominates). We show NAV/share + shares outstanding by class, plus a
  // quarterly per-share return % computed from class I (the dominant class
  // for every multi-class fund in the universe).
  const SHARE_CLASSES = ['i', 's', 'd', 't', 'e'];
  const hasPerShare = quarters.some(q =>
    SHARE_CLASSES.some(c =>
      q['nav_per_share_class_' + c] != null ||
      q['shares_outstanding_class_' + c] != null
    )
  );

  let PER_SHARE_SECTION = null;
  if (hasPerShare) {
    // Only show classes that actually have data in at least one quarter.
    const classesWithData = SHARE_CLASSES.filter(c =>
      quarters.some(q =>
        q['nav_per_share_class_' + c] != null ||
        q['shares_outstanding_class_' + c] != null
      )
    );
    const psRows = [];
    // NAV / share by class
    for (const c of classesWithData) {
      psRows.push({
        label: `NAV / share — Class ${c.toUpperCase()}`,
        key: 'nav_per_share_class_' + c,
        kind: 'usd',
      });
    }
    // Shares outstanding by class
    for (const c of classesWithData) {
      psRows.push({
        label: `Shares outstanding — Class ${c.toUpperCase()}`,
        key: 'shares_outstanding_class_' + c,
        kind: 'int',
      });
    }
    // Distribution per share (fund-level approximation: |distributions_total| / total shares outstanding)
    psRows.push({
      label: `Distribution / share`,
      key: 'dist_per_share',
      kind: 'usd',
    });
    // Fund-REPORTED per-class total return (Financial Highlights, YTD chains
    // de-telescoped to quarterly in 09_quarterize.py) — the fund's own
    // '40-Act total-return figure; shown first when available.
    const reportedClasses = SHARE_CLASSES.filter(c =>
      quarters.some(q => q['fh_reported_return_class_' + c] != null));
    for (const c of reportedClasses) {
      psRows.push({
        label: `Reported total return (%) — Class ${c.toUpperCase()}`,
        key: 'fh_reported_return_class_' + c,
        kind: 'pctSigned',
      });
    }
    // Per-share quarterly TOTAL return derived by us (NAV change +
    // distribution per share), precomputed in 09_quarterize.py per class.
    for (const c of classesWithData) {
      psRows.push({
        label: `Total return, derived (%) — Class ${c.toUpperCase()}`,
        key: 'per_share_return_class_' + c,
        kind: 'pctSigned',
      });
    }
    PER_SHARE_SECTION = { name: 'Per share', rows: psRows };
  }

  // Header row: empty corner + quarter labels
  let html = '<thead><tr><th class="row-label">Metric \\ Period</th>';
  for (const q of quarters) {
    const cls = q.source_form === 'derived-Q4' ? 'qhead derived'
              : q.period_type === 'H' ? 'qhead semi'
              : q.period_type === 'FY' ? 'qhead annual'
              : 'qhead';
    html += `<th class="${cls}"><div>${q.quarter_label}</div><div class="qhead-sub">${q.source_form}</div></th>`;
  }
  html += '</tr></thead><tbody>';

  const allSections = PER_SHARE_SECTION ? SECTIONS.concat([PER_SHARE_SECTION]) : SECTIONS;
  for (const section of allSections) {
    const sectionSlug = section.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    html += `<tr class="section-row" data-section="${sectionSlug}"><td colspan="${quarters.length + 1}">${section.name}</td></tr>`;
    for (const row of section.rows) {
      html += `<tr class="metric-row" data-section="${sectionSlug}"><td class="row-label">${row.label}</td>`;
      for (let qi = 0; qi < quarters.length; qi++) {
        const q = quarters[qi];
        let v;
        if (row.key === '_total_subscriptions') {
          // All new investor money in: common stock + DRIP + DST proceeds.
          // DST proceeds are gross 1031-exchange capital sold this quarter
          // (Ares REITs only). Excludes OP-unit ← DST conversions, which
          // are intra-platform reclassifications, not new money.
          const a = q.issuance_total, b = q.drip_total, c = q.dst_proceeds_usd;
          const parts = [a, b, c].filter(x => x != null);
          v = parts.length ? parts.reduce((s, x) => s + x, 0) : null;
        } else if (row.key === '_operating_return') {
          // Derived: net_inc_from_ops / nav_bop
          const nio = q.net_inc_from_ops, bop = q.nav_bop;
          v = (nio != null && bop != null && bop !== 0) ? nio / bop : null;
        } else {
          v = q[row.key];
        }
        let text = '—';
        let cls = 'val';
        if (row.kind === 'text') {
          // Plain string — used for source/provenance labels
          if (v) { text = String(v); cls += ' dim'; }
        } else if (v != null && !Number.isNaN(v)) {
          if (row.kind === 'money') {
            // Show as positive magnitude; if stored as negative, display in parens.
            text = fmtM(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'moneySigned') {
            text = fmtMSigned(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'moneyNeg') {
            // Distributions / repurchases — typically stored negative.
            // Always display as a negative magnitude in red, parenthesized.
            const mag = -Math.abs(v);
            text = fmtM(mag);
            cls += ' neg';
          } else if (row.kind === 'pctSigned') {
            text = fmtPctSigned(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'pct') {
            text = fmtPct(v);
          } else if (row.kind === 'pct2') {
            // Fee rates need 2 decimals (1.07% vs 1.25% matters).
            text = (v * 100).toFixed(2) + '%';
          } else if (row.kind === 'usd') {
            // Per-share NAV in dollars (e.g. $24.19), not millions.
            text = fmtUsd(v);
          } else if (row.kind === 'int') {
            text = fmtInt(v);
          }
        }
        if (q.source_form === 'derived-Q4') cls += ' derived';
        // Interpolated fee/expense cells: when quarterize splits H1/FY
        // cumulative values across quarters (NAV-weighted), flag the cell
        // with an "interp" superscript and tinted background so users see
        // these are estimates, not directly reported.
        const interpFields = (q.interpolated_fields || '').split(',').filter(Boolean);
        let tooltip = '';
        if (interpFields.includes(row.key) && v != null) {
          cls += ' interpolated';
          const src = q.fee_interp_source || '';
          const method = q.fee_interp_method || 'NAV-weighted';
          // Incentive fees use return-weighting (performance-driven);
          // others use NAV-weighting.
          const weightNote = (row.key === 'incentive_fee_income_based'
                              ? 'return-weighted (max(0, quarterly return))'
                              : 'NAV-weighted (avg of BOP/EOP)');
          text = `${text} <sup style="font-size:9px;color:var(--accent);font-weight:600;letter-spacing:0.02em">interp</sup>`;
          tooltip = ` title="Interpolated single-quarter value — ${weightNote} split of ${src}. Quarter values sum to the reported H1 / FY cumulative."`;
        }
        html += `<td class="${cls}"${tooltip}>${text}</td>`;
      }
      html += '</tr>';
    }
  }
  html += '</tbody>';
  table.innerHTML = html;

  function setPeriodView(view) {
    const next = new URL(location.href);
    view === 'all' ? next.searchParams.set('periods', 'all') : next.searchParams.delete('periods');
    location.href = next;
  }
  document.getElementById('period-recent').addEventListener('click', () => setPeriodView('recent'));
  document.getElementById('period-all').addEventListener('click', () => setPeriodView('all'));
  document.querySelectorAll('[data-section-filter]').forEach(button => button.addEventListener('click', () => {
    const wanted = button.dataset.sectionFilter;
    document.querySelectorAll('[data-section-filter]').forEach(b => b.classList.toggle('active', b === button));
    table.querySelectorAll('tbody tr[data-section]').forEach(row => {
      row.hidden = wanted !== 'all' && row.dataset.section !== wanted;
    });
  }));

  // Performance-over-time chart — quarterly return % bars + cumulative line
  const labels = quarters.map(q => q.quarter_label);
  const qReturns = quarters.map(q => q.unified_return_pct != null ? q.unified_return_pct * 100 : null);
  // Cumulative (compounded) return from first quarter
  let cum = 1;
  const cumReturns = quarters.map(q => {
    if (q.unified_return_pct == null) return null;
    cum *= (1 + q.unified_return_pct);
    return (cum - 1) * 100;
  });
  const ctx = document.getElementById('perfChart').getContext('2d');
  new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { type: 'bar', label: 'Quarterly return %',
          data: qReturns, yAxisID: 'y1',
          backgroundColor: qReturns.map(v => v == null ? '#ccc' : (v >= 0 ? 'rgba(46,160,67,0.7)' : 'rgba(207,34,46,0.7)')),
          borderColor: 'rgba(0,0,0,0)' },
        { type: 'line', label: 'Cumulative return %',
          data: cumReturns, yAxisID: 'y2',
          borderColor: '#1f5fa6', backgroundColor: '#1f5fa6',
          borderWidth: 1.8, pointRadius: 0, tension: 0.15, spanGaps: true },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { font: {size:11}, boxWidth: 10 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y != null ? c.parsed.y.toFixed(2)+'%' : '—'}` } },
      },
      scales: {
        x: { ticks: { font: {size: 10}, maxRotation: 0, autoSkip: true, maxTicksLimit: 14 } },
        y1: { position: 'left', ticks: { font: {size: 10}, callback: v => v.toFixed(1)+'%' },
              title: { display: true, text: 'Quarterly %', font: {size: 10} } },
        y2: { position: 'right', grid: { drawOnChartArea: false }, ticks: { font: {size: 10}, callback: v => v.toFixed(0)+'%' },
              title: { display: true, text: 'Cumulative %', font: {size: 10} } },
      },
    },
  });

  // ---- Monthly return history (year × month grid, bottom of page) --------
  // Lazy-fetches data-monthly.json (monthly rows are not in data-core.json)
  // and renders the fund's monthly net return track record — deepest for the
  // PG factsheet-grid funds (TPF Trust back to 2003), but any fund with ≥6
  // months of monthly_return_pct gets the section. FY = compounded from the
  // months shown; * marks partial years.
  (async () => {
    let md;
    try { md = await loadData('./data-monthly.json'); } catch { return; }
    const mrows = (md.monthly || [])
      .filter(r => r.ticker === ticker && r.monthly_return_pct != null);
    if (mrows.length < 6) return;
    const SRC_LABELS = {
      factsheet_grid: 'manager factsheet track record (lead class, net)',
      factsheet: 'manager factsheet (stated MTD)',
    };
    const srcs = [...new Set(mrows.map(r => r.monthly_return_src).filter(Boolean))]
      .map(s => SRC_LABELS[s] || s);
    const byYear = new Map();
    for (const r of mrows) {
      const y = +r.as_of_date.slice(0, 4), m = +r.as_of_date.slice(5, 7);
      if (!byYear.has(y)) byYear.set(y, {});
      byYear.get(y)[m] = r.monthly_return_pct;
    }
    const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const cell = v => v == null
      ? '<td class="mh-c zero">—</td>'
      : `<td class="mh-c ${signClass(v)}">${v.toFixed(1)}</td>`;
    const rowsHtml = [...byYear.keys()].sort((a, b) => b - a).map(y => {
      const ms = byYear.get(y);
      let comp = 1, n = 0;
      for (let m = 1; m <= 12; m++) if (ms[m] != null) { comp *= 1 + ms[m] / 100; n++; }
      const fy = (comp - 1) * 100;
      return `<tr><td class="mh-c mh-y">${y}</td>`
        + MN.map((_, i) => cell(ms[i + 1])).join('')
        + `<td class="mh-c mh-fy ${signClass(fy)}">${fy.toFixed(1)}${n < 12 ? '*' : ''}</td></tr>`;
    }).join('');
    // NAV estimate + reconstructed NAV/share series (present for the PG
    // factsheet-grid funds; native currency, labeled from nav_est_ccy)
    const est = mrows.filter(r => r.nav_est_m != null);
    const navps = mrows.filter(r => r.navps_recon != null);
    const ccy = (est.find(r => r.nav_est_ccy) || {}).nav_est_ccy || 'USD';
    const BASIS_COLOR = { audited: '#1f5fa6', factsheet: '#b58a00',
                          'factsheet-rescaled': '#b58a00', reported: '#7b3f99' };
    document.getElementById('monthly-history').innerHTML = `
      <style>
        #monthly-history .mh-c { padding:3px 7px; text-align:right;
          font-variant-numeric:tabular-nums; font-size:12.5px; white-space:nowrap; }
        #monthly-history th.mh-c { color:var(--muted); font-weight:600;
          border-bottom:1px solid var(--border, #ddd); }
        #monthly-history .mh-y { font-weight:600; text-align:left; }
        #monthly-history .mh-fy { font-weight:600;
          border-left:1px solid var(--border, #ddd); }
        #monthly-history .mh-note { font-size:12px; color:var(--muted);
          margin:-8px 0 10px; }
      </style>
      ${est.length ? `
      <h2 class="section-title">Fund NAV — anchored estimate</h2>
      <div class="mh-note">
        Audited period-end net assets (dark dots) joined by compounding the
        monthly track record; amber dots anchor recent months to the
        factsheet fund size${est.some(r => r.nav_est_basis === 'factsheet-rescaled')
          ? ' (rescaled onto the audited basis at the latest overlapping date)' : ''}.
        Bars: implied monthly net capital flow — the residual that makes the
        chain hit each anchor; it also absorbs lead-class vs fund-level
        return timing, so read it cumulatively (audited annual flows are in
        the Quarterly detail above). All in ${ccy} millions.</div>
      <div class="chart-wrap" style="height:270px;margin:0 0 16px;"><canvas id="mhNavChart"></canvas></div>` : ''}
      ${navps.length > Math.max(est.length, 12) ? `
      <h2 class="section-title">NAV per share — reconstructed since inception</h2>
      <div class="mh-note">
        De-compounded from the latest factsheet NAV/share through the monthly
        track record (lead class, net of fees). Exact for an accumulating
        class; levels before the fund's audited history are a performance
        index, not audited prices.</div>
      <div class="chart-wrap" style="height:220px;margin:0 0 16px;"><canvas id="mhNavpsChart"></canvas></div>` : ''}
      <h2 class="section-title">Monthly return history</h2>
      <div class="mh-note">
        ${mrows.length} months, ${mrows[0].as_of_date.slice(0,7)} →
        ${mrows[mrows.length-1].as_of_date.slice(0,7)} · net monthly return %
        · source: ${srcs.join(' + ') || '—'}
        · FY compounded from months shown, * = partial year</div>
      <div style="overflow-x:auto;">
        <table style="border-collapse:collapse;min-width:740px;">
          <tr><th class="mh-c"></th>${MN.map(m => `<th class="mh-c">${m}</th>`).join('')}<th class="mh-c">FY</th></tr>
          ${rowsHtml}
        </table>
      </div>`;
    if (est.length) {
      new Chart(document.getElementById('mhNavChart').getContext('2d'), {
        data: {
          labels: est.map(r => r.as_of_date.slice(0, 7)),
          datasets: [
            { type: 'bar', label: `Implied net flow (${ccy}m)`, yAxisID: 'y2',
              data: est.map(r => r.implied_net_flow_m),
              backgroundColor: est.map(r => (r.implied_net_flow_m || 0) >= 0
                ? 'rgba(46,160,67,0.45)' : 'rgba(207,34,46,0.45)') },
            { type: 'line', label: `NAV estimate (${ccy}m)`, yAxisID: 'y1',
              data: est.map(r => r.nav_est_m),
              borderColor: '#1f5fa6', backgroundColor: 'rgba(31,95,166,0.10)',
              borderWidth: 1.8, tension: 0.15, fill: true, spanGaps: true,
              pointRadius: est.map(r => r.nav_est_basis && r.nav_est_basis !== 'interpolated' ? 4 : 0),
              pointBackgroundColor: est.map(r => BASIS_COLOR[r.nav_est_basis] || '#1f5fa6') },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'bottom', labels: { font: {size: 11}, boxWidth: 10 } },
            tooltip: { callbacks: {
              label: c => `${c.dataset.label}: ${c.parsed.y == null ? '—'
                : c.parsed.y.toLocaleString('en-US', {maximumFractionDigits: 1})}`
                + (c.datasetIndex === 1 && est[c.dataIndex].nav_est_basis !== 'interpolated'
                   ? ` · anchor: ${est[c.dataIndex].nav_est_basis}` : ''),
            } },
          },
          scales: {
            x: { ticks: { font: {size: 10}, maxRotation: 0, autoSkip: true, maxTicksLimit: 14 } },
            y1: { position: 'left', ticks: { font: {size: 10},
                  callback: v => (v/1000).toFixed(1) + 'bn' },
                  title: { display: true, text: `NAV (${ccy}bn)`, font: {size: 10} } },
            y2: { position: 'right', grid: { drawOnChartArea: false },
                  ticks: { font: {size: 10} },
                  title: { display: true, text: `Flow (${ccy}m)`, font: {size: 10} } },
          },
        },
      });
    }
    if (navps.length > Math.max(est.length, 12)) {
      new Chart(document.getElementById('mhNavpsChart').getContext('2d'), {
        type: 'line',
        data: {
          labels: navps.map(r => r.as_of_date.slice(0, 7)),
          datasets: [{ label: `NAV/share (${ccy}, reconstructed)`,
            data: navps.map(r => r.navps_recon),
            borderColor: '#2c9f3a', backgroundColor: 'rgba(46,160,67,0.08)',
            borderWidth: 1.6, pointRadius: 0, tension: 0.1, fill: true }],
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { position: 'bottom', labels: { font: {size: 11}, boxWidth: 10 } } },
          scales: {
            x: { ticks: { font: {size: 10}, maxRotation: 0, autoSkip: true, maxTicksLimit: 16 } },
            y: { ticks: { font: {size: 10} } },
          },
        },
      });
    }
  })();
})();
</script>
</body>
</html>
