<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fund detail — Alt-Manager Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">ALT-MANAGER <span class="accent">TRACKER</span></div>
  <nav>
    <a href="./index.html">Universe</a>
    <a href="./fund.html" class="active">Fund</a>
    <a href="./compare.html">Compare</a>
  </nav>
  <div class="meta" id="refresh-meta">Loading…</div>
</header>

<main>
  <div id="fund-root" class="loading">Loading fund…</div>
</main>

<footer class="sitefoot">
  Data extracted from SEC EDGAR 10-K / 10-Q / N-CSR filings. All dollar values in millions.
</footer>

<script src="./app.js"></script>
<script>
(async function() {
  paintRefreshDate();
  const params = new URLSearchParams(location.search);
  const ticker = params.get('ticker');
  const root = document.getElementById('fund-root');

  if (!ticker) {
    root.className = '';
    root.innerHTML = '<div class="error-msg">No ticker specified. Add <code>?ticker=BCRED</code> to the URL or pick a fund from the <a href="./index.html">Universe page</a>.</div>';
    return;
  }

  let data;
  try { data = await loadData(); } catch { return; }
  const universe = data.universe.find(u => u.ticker === ticker);
  const quartersAll = data.quarters || [];
  const quarters = quartersAll
    .filter(q => q.ticker === ticker)
    .sort((a, b) => quarterSortKey(a.quarter_label) - quarterSortKey(b.quarter_label));

  if (!universe) {
    root.className = '';
    root.innerHTML = `<div class="error-msg">Ticker <b>${ticker}</b> not found in universe.</div>`;
    return;
  }
  if (!quarters.length) {
    root.className = '';
    root.innerHTML = `
      <div class="fund-header">
        <div class="name-row"><span class="ticker-badge">${ticker}</span><h1>${universe.legal_name}</h1></div>
      </div>
      <div class="error-msg">No quarterly data extracted yet for ${ticker}.</div>`;
    return;
  }

  const latest = quarters[quarters.length - 1];
  const first = quarters[0];

  root.className = '';
  const cikPadded = (universe.cik_padded || universe.cik || '').padStart(10, '0');
  const edgarUrl = `https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=${cikPadded}&type=&dateb=&owner=include&count=40`;

  // Period type: are we in Q-mode (BDC/REIT) or H/FY-mode (N-CSR)?
  // If all rows are H or FY, use the H/FY layout; otherwise Q layout.
  const allHFY = quarters.every(q => q.period_type === 'H' || q.period_type === 'FY');

  // Latest net flow (subs - reps) and NAV
  const netFlow = ((latest.issuance_total || 0) + (latest.drip_total || 0))
                 + (latest.repurchases_total != null ? -Math.abs(latest.repurchases_total) : 0);

  root.innerHTML = `
    <div class="fund-header">
      <div class="name-row">
        <span class="ticker-badge">${ticker}</span>
        <h1>${universe.legal_name}</h1>
      </div>
      <div class="pills">
        <span class="pill">${universe.sponsor}</span>
        <span class="pill">${universe.strategy}</span>
        <span class="pill">${universe.form_factor}</span>
        ${universe.status ? `<span class="pill">${universe.status}</span>` : ''}
      </div>
      <div class="links">
        Latest filing: ${fmtDate(latest.filing_date)} (${latest.source_form}) ·
        CIK ${cikPadded} ·
        <a href="${edgarUrl}" target="_blank" rel="noopener">SEC EDGAR &rarr;</a>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="label">Latest NAV</div><div class="value">${fmtM(latest.nav_eop)}</div><div class="sub">${latest.quarter_label}</div></div>
      <div class="stat-card"><div class="label">NAV change (period)</div><div class="value ${signClass(latest.nav_change_pct)}">${fmtPctSigned(latest.nav_change_pct)}</div><div class="sub">vs prior period</div></div>
      <div class="stat-card"><div class="label">Net capital activity (latest)</div><div class="value ${signClass(latest.net_capital_activity)}">${fmtM(latest.net_capital_activity)}</div><div class="sub">${latest.quarter_label}</div></div>
      <div class="stat-card"><div class="label">Periods tracked</div><div class="value">${quarters.length}</div><div class="sub">${first.quarter_label} → ${latest.quarter_label}</div></div>
    </div>

    <h2 class="section-title">Quarterly detail</h2>
    <div class="legend">
      <span class="legend-chip"><span class="dot legend-q"></span>Q = 10-Q quarterly</span>
      <span class="legend-chip"><span class="dot legend-derived"></span>derived Q4 = computed from 10-K minus Q1+Q2+Q3</span>
      <span class="legend-chip"><span class="dot legend-h"></span>H/FY = semi-annual or full-year (N-CSR)</span>
    </div>
    <div class="qtable-wrap">
      <table class="qtable" id="qtable"></table>
    </div>
  `;

  // ---- Build transposed table ----
  const table = document.getElementById('qtable');

  // Sections of metrics. Each row: {label, key, kind: 'money'|'pct'|''}
  const SECTIONS = [
    { name: 'NAV', rows: [
      { label: 'NAV — beginning of period', key: 'nav_bop', kind: 'money' },
      { label: 'NAV — end of period', key: 'nav_eop', kind: 'money' },
      { label: 'NAV change ($)', key: 'nav_change', kind: 'moneySigned' },
      { label: 'NAV change (%)', key: 'nav_change_pct', kind: 'pctSigned' },
    ]},
    { name: 'Flows', rows: [
      { label: 'Cash subscriptions', key: 'issuance_total', kind: 'money' },
      { label: 'DRIP', key: 'drip_total', kind: 'money' },
      { label: 'Total subscriptions', key: '_total_subscriptions', kind: 'money' },
      { label: 'Redemptions', key: 'repurchases_total', kind: 'moneyNeg' },
      { label: 'Distributions', key: 'distributions_total', kind: 'moneyNeg' },
      { label: 'Net capital activity', key: 'net_capital_activity', kind: 'moneySigned' },
    ]},
    { name: 'Income / P&L', rows: [
      { label: 'Investment income / revenues', key: 'total_investment_income_or_revenues', kind: 'money' },
      { label: 'Net investment income / net income', key: 'net_income_or_nii', kind: 'moneySigned' },
      { label: 'Net change from operations', key: 'net_inc_from_ops', kind: 'moneySigned' },
    ]},
    { name: 'Expenses', rows: [
      { label: 'Management fees', key: 'management_fees', kind: 'money' },
      { label: 'Incentive fees (income-based)', key: 'incentive_fee_income_based', kind: 'money' },
      { label: 'Total expenses (gross)', key: 'total_expenses_gross', kind: 'money' },
    ]},
    { name: 'Balance sheet (point-in-time)', rows: [
      { label: 'Total assets', key: 'total_assets', kind: 'money' },
      { label: 'Total debt', key: 'total_debt', kind: 'money' },
      { label: 'Total net assets / equity', key: 'total_net_assets_or_equity', kind: 'money' },
    ]},
  ];

  // ---- Per-share section (only for funds that have any per-share data) ----
  // Multi-class share classes: I, S, D, T, E (in priority order — I usually
  // dominates). We show NAV/share + shares outstanding by class, plus a
  // quarterly per-share return % computed from class I (the dominant class
  // for every multi-class fund in the universe).
  const SHARE_CLASSES = ['i', 's', 'd', 't', 'e'];
  const hasPerShare = quarters.some(q =>
    SHARE_CLASSES.some(c =>
      q['nav_per_share_class_' + c] != null ||
      q['shares_outstanding_class_' + c] != null
    )
  );

  let PER_SHARE_SECTION = null;
  if (hasPerShare) {
    // Only show classes that actually have data in at least one quarter.
    const classesWithData = SHARE_CLASSES.filter(c =>
      quarters.some(q =>
        q['nav_per_share_class_' + c] != null ||
        q['shares_outstanding_class_' + c] != null
      )
    );
    const psRows = [];
    // NAV / share by class
    for (const c of classesWithData) {
      psRows.push({
        label: `NAV / share — Class ${c.toUpperCase()}`,
        key: 'nav_per_share_class_' + c,
        kind: 'usd',
      });
    }
    // Shares outstanding by class
    for (const c of classesWithData) {
      psRows.push({
        label: `Shares outstanding — Class ${c.toUpperCase()}`,
        key: 'shares_outstanding_class_' + c,
        kind: 'int',
      });
    }
    // Per-share quarterly return %, computed for each class that has data
    for (const c of classesWithData) {
      psRows.push({
        label: `Per-share return (%) — Class ${c.toUpperCase()}`,
        key: '_per_share_return_class_' + c,
        kind: 'pctSigned',
      });
    }
    PER_SHARE_SECTION = { name: 'Per share', rows: psRows };
  }

  // Header row: empty corner + quarter labels
  let html = '<thead><tr><th class="row-label">Metric \\ Period</th>';
  for (const q of quarters) {
    const cls = q.source_form === 'derived-Q4' ? 'qhead derived'
              : q.period_type === 'H' ? 'qhead semi'
              : q.period_type === 'FY' ? 'qhead annual'
              : 'qhead';
    html += `<th class="${cls}"><div>${q.quarter_label}</div><div class="qhead-sub">${q.source_form}</div></th>`;
  }
  html += '</tr></thead><tbody>';

  const allSections = PER_SHARE_SECTION ? SECTIONS.concat([PER_SHARE_SECTION]) : SECTIONS;
  for (const section of allSections) {
    html += `<tr class="section-row"><td colspan="${quarters.length + 1}">${section.name}</td></tr>`;
    for (const row of section.rows) {
      html += `<tr><td class="row-label">${row.label}</td>`;
      for (let qi = 0; qi < quarters.length; qi++) {
        const q = quarters[qi];
        let v;
        if (row.key === '_total_subscriptions') {
          const a = q.issuance_total, b = q.drip_total;
          v = (a == null && b == null) ? null : (a || 0) + (b || 0);
        } else if (row.key && row.key.startsWith('_per_share_return_class_')) {
          // (nav_eop_per_share - nav_bop_per_share) / nav_bop_per_share
          const c = row.key.slice('_per_share_return_class_'.length);
          const eop = q['nav_per_share_class_' + c];
          // BOP = prior quarter's EOP (same class)
          const prev = qi > 0 ? quarters[qi - 1] : null;
          const bop = prev ? prev['nav_per_share_class_' + c] : null;
          v = (eop != null && bop != null && bop !== 0) ? (eop - bop) / bop : null;
        } else {
          v = q[row.key];
        }
        let text = '—';
        let cls = 'val';
        if (v != null && !Number.isNaN(v)) {
          if (row.kind === 'money') {
            // Show as positive magnitude; if stored as negative, display in parens.
            text = fmtM(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'moneySigned') {
            text = fmtMSigned(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'moneyNeg') {
            // Distributions / repurchases — typically stored negative.
            // Always display as a negative magnitude in red, parenthesized.
            const mag = -Math.abs(v);
            text = fmtM(mag);
            cls += ' neg';
          } else if (row.kind === 'pctSigned') {
            text = fmtPctSigned(v);
            cls += ' ' + signClass(v);
          } else if (row.kind === 'pct') {
            text = fmtPct(v);
          } else if (row.kind === 'usd') {
            // Per-share NAV in dollars (e.g. $24.19), not millions.
            text = fmtUsd(v);
          } else if (row.kind === 'int') {
            text = fmtInt(v);
          }
        }
        if (q.source_form === 'derived-Q4') cls += ' derived';
        html += `<td class="${cls}">${text}</td>`;
      }
      html += '</tr>';
    }
  }
  html += '</tbody>';
  table.innerHTML = html;
})();
</script>
</body>
</html>
